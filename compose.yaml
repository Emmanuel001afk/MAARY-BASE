services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maary}
      POSTGRES_USER: ${POSTGRES_USER:-maary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maary_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maary} -d ${POSTGRES_DB:-maary}"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER:-maary}:${POSTGRES_PASSWORD:-change-this-local-password}@database:5432/${POSTGRES_DB:-maary}
      JWT_SECRET: ${JWT_SECRET:?Set a unique 32+ char JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a unique 32+ char ENCRYPTION_KEY in .env}
      PLATFORM_BOOTSTRAP_TOKEN: ${PLATFORM_BOOTSTRAP_TOKEN:?Set a unique 32+ char PLATFORM_BOOTSTRAP_TOKEN in .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      STORAGE_DIR: /app/storage
      BACKUP_DIR: /app/data/backups
      AUTO_MIGRATE: "true"
      WORKER_ENABLED: "true"
    ports:
      - "127.0.0.1:${PORT:-4100}:4100"
    volumes:
      - maary_storage:/app/storage
      - maary_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  maary_postgres:
  maary_storage:
  maary_data:
