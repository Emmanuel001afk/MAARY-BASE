services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maary
      POSTGRES_USER: maary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maary_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maary -d maary"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  maary_postgres:
