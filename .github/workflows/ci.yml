name: MARRY BASE CI & APK Artifact Build

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle & Android APK
        run: npm run build

      - name: Run adversarial & integration test suites
        run: npm test

      - name: Verify MARRY BASE Android APK & App Icon Artifacts
        run: |
          test -s releases/marry-base.apk
          test -s assets/logo.png
          test -s assets/app-icon.png
          test -s assets/logo.svg
          test -s assets/app-icon.svg
          {
            echo "## MARRY BASE Verified Build Artifacts"
            echo ""
            echo "| Artifact | Size (Bytes) | SHA-256 Checksum |"
            echo "| :--- | ---: | :--- |"
            for f in releases/marry-base.apk assets/logo.png assets/app-icon.png assets/logo.svg assets/app-icon.svg; do
              size=$(wc -c < "$f" | tr -d ' ')
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "| \`$f\` | $size | \`$sha\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
