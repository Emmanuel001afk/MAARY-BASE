name: MARRY BASE CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Real Android build. This is the only producer of the companion APK; the
  # server reports the artifact's presence and never synthesises one.
  android:
    name: Android Gradle build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Android SDK and toolchain
        run: |
          set -u
          echo "::notice::CI-MARK toolchain-probe-start"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "JAVA_HOME=${JAVA_HOME:-unset}"
          java -version
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "$SDK" 2>/dev/null | head || true
          ls "$SDK/platforms" 2>/dev/null | tail -3 || true
          ls "$SDK/build-tools" 2>/dev/null | tail -3 || true
          echo "::notice::CI-MARK toolchain-probe-done"

      - name: Gradle wrapper version
        working-directory: android
        run: |
          echo "::notice::CI-MARK wrapper-version-start"
          set +e
          ./gradlew --version --console=plain 2>&1 | tee /tmp/gradle-version.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 25 /tmp/gradle-version.log | while IFS= read -r line; do
              echo "::error::wrapper: ${line}"
            done
            exit "$status"
          fi
          echo "::notice::CI-MARK wrapper-version-done"

      # Gradle failures are surfaced as GitHub annotations so the reason is
      # readable from the API even when the raw job log is unavailable.
      - name: Unit-test server address validation
        working-directory: android
        run: |
          echo "::notice::CI-MARK unit-tests-start"
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "^(FAILURE:|\* What went wrong:|Caused by:|Execution failed for task|> Task .* FAILED|e: |.*error:)" /tmp/gradle-unit-tests.log \
              | head -8 | while IFS= read -r line; do echo "::error::unit-tests: ${line}"; done
            tail -n 40 /tmp/gradle-unit-tests.log
            exit "$status"
          fi
          echo "::notice::CI-MARK unit-tests-done"

      - name: Build debug APK
        working-directory: android
        run: |
          echo "::notice::CI-MARK assemble-start"
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain \
            -PmarryVersionName=1.1.0 -PmarryVersionCode=2 2>&1 | tee /tmp/gradle-assemble.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "^(FAILURE:|\* What went wrong:|Caused by:|Execution failed for task|> Task .* FAILED|e: |.*error:)" /tmp/gradle-assemble.log \
              | head -8 | while IFS= read -r line; do echo "::error::assemble: ${line}"; done
            tail -n 40 /tmp/gradle-assemble.log
            exit "$status"
          fi
          echo "::notice::CI-MARK assemble-done"

      - name: Verify APK is a genuine, signed Android package
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }
          echo "::notice::CI-MARK verify-apk-start"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            ls -R android/app/build/outputs 2>/dev/null || true
            fail "No APK was produced at $APK"
          fi
          SIZE=$(wc -c < "$APK" | tr -d ' ')
          echo "APK size: $SIZE bytes"
          [ "$SIZE" -gt 20000 ] || fail "APK is implausibly small ($SIZE bytes)"
          unzip -l "$APK" > /tmp/entries.txt || fail "APK is not a readable ZIP archive"
          head -30 /tmp/entries.txt
          grep -q "AndroidManifest.xml" /tmp/entries.txt || fail "AndroidManifest.xml is missing from the APK"
          grep -q "classes.dex" /tmp/entries.txt || fail "classes.dex is missing from the APK (no application code)"
          grep -q "resources.arsc" /tmp/entries.txt || fail "resources.arsc is missing from the APK"
          echo "::notice::CI-MARK apk-structure-ok"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || fail "Android SDK directory not found (checked ANDROID_HOME, ANDROID_SDK_ROOT, $SDK)"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          [ -n "${BUILD_TOOLS:-}" ] && [ -d "$BUILD_TOOLS" ] || fail "No Android build-tools installed under $SDK/build-tools"
          echo "Using build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/aapt2" dump badging "$APK" > /tmp/badging.txt 2>/tmp/badging.err \
            || fail "aapt2 dump badging failed: $(tail -3 /tmp/badging.err | tr '\n' ' ')"
          echo "::notice::badging: $(head -12 /tmp/badging.txt | tr '\n' '|')"
          grep -q "package: name='com.marrybase.platform'" /tmp/badging.txt \
            || fail "Unexpected package: $(grep -m1 '^package:' /tmp/badging.txt)"

          # minSdk is asserted against the compiled manifest, not against a
          # human-readable format string: aapt2 build-tools versions differ in
          # how (and whether) `dump badging` prints the SDK level.
          MIN_SDK_OK=0
          if grep -qE "^(sdkVersion|minSdkVersion):'24'" /tmp/badging.txt; then
            MIN_SDK_OK=1
          else
            "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/xmltree.txt 2>&1 || true
            if grep -q "minSdkVersion(0x0101020c)=(type 0x10)0x18" /tmp/xmltree.txt; then
              MIN_SDK_OK=1
            fi
          fi
          if [ "$MIN_SDK_OK" -ne 1 ]; then
            grep -m3 -i "sdk" /tmp/xmltree.txt /tmp/badging.txt | while IFS= read -r line; do echo "::error::sdk-evidence: $line"; done
            fail "The packaged manifest does not declare minSdkVersion 24"
          fi
          echo "::notice::minSdk 24 verified in the compiled manifest"

          echo "::notice::CI-MARK apk-badging-ok"

          if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/signature.txt 2>&1; then
            tail -6 /tmp/signature.txt | while IFS= read -r line; do echo "::error::apksigner: $line"; done
            exit 1
          fi
          grep -E "^(Verifies|Verified using|Number of signers)" /tmp/signature.txt || fail "apksigner reported no verification result"
          echo "::notice::CI-MARK apk-signature-ok"

          if ! "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" > /tmp/align.txt 2>&1; then
            tail -4 /tmp/align.txt | while IFS= read -r line; do echo "::error::zipalign: $line"; done
            exit 1
          fi
          echo "::notice::CI-MARK apk-alignment-ok"

          mkdir -p releases
          cp "$APK" releases/marry-base.apk
          node -e "
            const {createHash}=require('crypto');const fs=require('fs');
            const b=fs.readFileSync('releases/marry-base.apk');
            fs.writeFileSync('releases/marry-base.apk.json', JSON.stringify({
              builtAt:new Date().toISOString(),builder:'github-actions-gradle',versionName:'1.1.0',versionCode:2,
              commit:process.env.GITHUB_SHA,sizeBytes:b.length,checksumSha256:createHash('sha256').update(b).digest('hex')
            },null,2));
          " || fail "Could not write releases/marry-base.apk.json"
          {
            echo "## MARRY BASE Android build"
            echo ""
            echo "- APK: \`releases/marry-base.apk\`"
            echo "- Size: $SIZE bytes"
            echo "- SHA-256: \`$(sha256sum releases/marry-base.apk | awk '{print $1}')\`"
            echo "- Signed: yes (CI debug keystore, verified with apksigner)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::CI-MARK verify-apk-done"

      - name: APK signature forensics
        if: always()
        run: |
          set -uo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::notice::forensics: no APK produced"
            exit 0
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "::notice::apksigner: $("$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tr '\n' '|')"
          node -e '
            const fs = require("fs");
            const b = fs.readFileSync("android/app/build/outputs/apk/debug/app-debug.apk");
            let eocd = -1;
            for (let i = b.length - 22; i >= Math.max(0, b.length - 65557); i--) {
              if (b.readUInt32LE(i) === 0x06054b50) { eocd = i; break; }
            }
            const cd = eocd >= 0 ? b.readUInt32LE(eocd + 16) : -1;
            const count = eocd >= 0 ? b.readUInt16LE(eocd + 10) : -1;
            const magic = Buffer.from("APK Sig Block 42", "ascii");
            console.log("::notice::apk-structure: size=" + b.length + " eocd=" + eocd +
              " cdOffset=" + cd + " entries=" + count +
              " magicIndex=" + b.indexOf(magic) +
              " magicAtCdMinus16=" + (cd > 16 && b.subarray(cd - 16, cd).equals(magic)) +
              " tail64=" + b.subarray(Math.max(0, cd - 64), cd).toString("hex"));
          '
          echo "::notice::fingerprint: $(sha256sum "$APK" | awk '{print $1}')"

      - name: Mark artifact upload
        run: echo "::notice::CI-MARK upload-start"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marry-base-android-apk
          path: |
            releases/marry-base.apk
            releases/marry-base.apk.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Typecheck & integration tests
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download the Gradle-built APK
        uses: actions/download-artifact@v4
        with:
          name: marry-base-android-apk
          path: releases

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Management Studio modules
        run: npm run check:studio

      - name: Validate mobile client modules
        run: npm run check:mobile

      - name: Build production bundle
        run: npm run build

      - name: Verify the downloaded APK signature with Android apksigner
        run: npm run verify:apk

      # Test output is echoed as annotations so a CI-only failure is readable
      # even when the raw job log is not retrievable.
      - name: Run integration test suites
        run: |
          set +e
          npm test 2>&1 | tee /tmp/npm-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::npm test exited $status ($(grep -c '^not ok' /tmp/npm-test.log) failing tests)"
            awk '
              /^not ok / {
                count++
                if (count > 5) next
                block = $0
                for (i = 0; i < 10; i++) {
                  if ((getline line) > 0) block = block " |" line
                }
                print "::error::" block
              }
            ' /tmp/npm-test.log
            tail -n 25 /tmp/npm-test.log
            exit "$status"
          fi

      - name: Publish workspace summary
        run: |
          {
            echo "## MARRY BASE build verification"
            echo ""
            echo "| Artifact | Size (bytes) | SHA-256 |"
            echo "| :--- | ---: | :--- |"
            for f in releases/marry-base.apk assets/logo.png assets/app-icon.png assets/logo.svg assets/app-icon.svg; do
              size=$(wc -c < "$f" | tr -d ' ')
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "| \`$f\` | $size | \`$sha\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
