name: MARRY BASE CI & APK Artifact Build

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle & Android APK
        run: npm run build

      - name: Run adversarial & integration test suites
        run: npm test

      - name: Upload MARRY BASE Android APK & App Icon Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marry-base-release-artifacts
          path: |
            releases/marry-base.apk
            assets/logo.png
            assets/app-icon.png
            assets/logo.svg
            assets/app-icon.svg
          if-no-files-found: error
