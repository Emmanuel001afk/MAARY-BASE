# MARRY BASE — single-node deployment with external PostgreSQL 17.
#
# Copy .env.example to .env and replace the three secrets below before running:
#   JWT_SECRET, ENCRYPTION_KEY, PLATFORM_BOOTSTRAP_TOKEN  (32+ random characters each)
#   POSTGRES_PASSWORD
#
#   docker compose up -d --build
#
# The API applies pending platform migrations on start (AUTO_MIGRATE=true).
# Project data and the control plane share this PostgreSQL instance but live in
# separate schemas; storage objects and backups use dedicated volumes.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: maary
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maary -d maary"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Uncomment to expose PostgreSQL to a trusted network only.
    # ports:
    #   - "127.0.0.1:5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4100
      DATABASE_URL: postgres://maary:${POSTGRES_PASSWORD}@postgres:5432/maary
      DATABASE_POOL_MAX: "20"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      PLATFORM_BOOTSTRAP_TOKEN: ${PLATFORM_BOOTSTRAP_TOKEN:?Set PLATFORM_BOOTSTRAP_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      AUTO_MIGRATE: "true"
      WORKER_ENABLED: "true"
      STORAGE_BACKEND: local
      STORAGE_DIR: /app/storage
      BACKUP_DIR: /app/data/backups
      APK_ARTIFACT_PATH: /app/releases/marry-base.apk
      APK_METADATA_PATH: /app/releases/marry-base.apk.json
      APP_VERSION: ${APP_VERSION:-1.1.0}
      APP_COMMIT: ${APP_COMMIT:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
    ports:
      - "${PORT:-4100}:4100"
    volumes:
      - app-data:/app/data
      - app-storage:/app/storage
      # CI-built APK (and .apk.json sidecar). Read-only: the API never writes here.
      - ./releases:/app/releases:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  app-data:
  app-storage:
