plugins {
    id "com.android.application"
}

def marryVersionCode = (project.findProperty("marryVersionCode") ?: "1").toInteger()
def marryVersionName = project.findProperty("marryVersionName") ?: "1.0.0"

android {
    namespace "com.marrybase.platform"
    compileSdk 34

    defaultConfig {
        applicationId "com.marrybase.platform"
        minSdk 24
        targetSdk 34
        versionCode marryVersionCode
        versionName marryVersionName
        // The Studio is served by the connected MARRY BASE server; only the
        // connection hub and its validation logic live on the device.
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${project.findProperty('marryDefaultServer') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            // Release signing is supplied by the operator (see docs/ANDROID.md).
            // CI falls back to the debug key so the artifact is installable and
            // its signature is verifiable with apksigner.
            signingConfig signingConfigs.debug
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
