plugins {
    id "com.android.application"
}

android {
    namespace "com.marrybase.platform"
    compileSdk 34

    defaultConfig {
        applicationId "com.marrybase.platform"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Package the same CSP-friendly mobile hub used by the downloadable builder.
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/mobileAssets"))
    }
}

def mobileAssetsDir = layout.buildDirectory.dir("generated/mobileAssets")
tasks.register("syncMobileClient", Copy) {
    from("../../public/mobile") {
        into "www"
    }
    into mobileAssetsDir
}
tasks.named("preBuild") {
    dependsOn("syncMobileClient")
}
