plugins {
    id "com.android.application"
}

def propVersionCode = (project.findProperty("marryBaseVersionCode") ?: "1").toInteger()
def propVersionName = (project.findProperty("marryBaseVersionName") ?: "1.0.0").toString()
def propServerUrl = (project.findProperty("marryBaseServerUrl") ?: "").toString()
def propProjectSlug = (project.findProperty("marryBaseProjectSlug") ?: "").toString()

android {
    namespace "com.marrybase.platform"
    compileSdk 34

    defaultConfig {
        applicationId "com.marrybase.platform"
        minSdk 24
        targetSdk 34
        versionCode propVersionCode
        versionName propVersionName

        resValue "string", "default_server_url", propServerUrl
        resValue "string", "default_project_slug", propProjectSlug
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "marrybase"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        disable "GradleDependency", "OldTargetApi", "SetJavaScriptEnabled"
    }
}
